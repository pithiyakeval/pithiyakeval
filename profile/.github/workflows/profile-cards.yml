name: Profile cards

on:
  schedule:
    - cron: "17 2 * * *"      # daily, 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render_cards.py, "fonts/**", "assets/**", .github/workflows/profile-cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution data
        env:
          # The default token sees public activity. To count private
          # contributions too, add a PAT (read:user) as PROFILE_TOKEN.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p data
          gh api graphql -F login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                login
                name
                repositories(ownerAffiliations: OWNER, privacy: PUBLIC) { totalCount }
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount weekday } }
                  }
                }
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name description url stargazerCount forkCount
                      primaryLanguage { name color }
                    }
                  }
                }
              }
            }' > data/contributions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install --quiet "fonttools>=4.40" pillow
          python render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards README.md data/contributions.json
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "Refresh profile cards"
            git push
          fi
