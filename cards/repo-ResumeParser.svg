<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" role="img" aria-labelledby="t"><title id="t">ResumeParser: Web app that takes PDF or DOCX resumes and pulls out name, contact details, experience and skills automatically.</title><style>@font-face{font-family:'body';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'medium';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'mono';src:url(data:font/woff;base64,) format('woff')}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
@keyframes growy{from{transform:scaleY(0)}}
