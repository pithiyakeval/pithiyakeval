<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" role="img" aria-labelledby="t"><title id="t">ResumeParser: Resume Parser Web App is a tool that allows users to upload resumes in PDF or DOCX format and automatically extracts key information like name, contact, email, experience, and skills. Built with Flask and React, it uses NLP techniques to handle resumes of various formats and structures. Ideal for quick resume screening and data extraction.</title><style>@font-face{font-family:'body';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'medium';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'mono';src:url(data:font/woff;base64,) format('woff')}
