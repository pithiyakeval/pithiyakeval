<svg xmlns="http://www.w3.org/2000/svg" width="840" height="255" viewBox="0 0 840 255" role="img" aria-labelledby="t"><title id="t">Pithiya Kevalkumar — Python &amp; full-stack developer — Django, Flask, React, Node.js.</title><style>@font-face{font-family:'display';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'medium';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'monob';src:url(data:font/woff;base64,) format('woff')}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}}
@keyframes growy{from{transform:scaleY(0)}}
